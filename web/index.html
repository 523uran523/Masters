<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Masters — локальный трекер для мастера/бригады">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Masters">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Masters</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="masters-loading" style="position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#1F1F1F; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; z-index:9999;">
    <img src="icons/Icon-192.png" width="96" height="96" alt="Masters" style="border-radius:22px; margin-bottom:24px;">
    <div style="font-size:22px; font-weight:600; letter-spacing:.3px;">Masters</div>
    <div id="masters-status" style="margin-top:10px; font-size:14px; opacity:.7;">Загрузка приложения…</div>
    <div id="masters-error" style="display:none; margin-top:18px; max-width:520px; padding:14px 18px; border-radius:10px; background:#3a1d1d; color:#ffb4b4; font-size:13px; line-height:1.45; white-space:pre-wrap;"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('masters-loading');
      if (loading) loading.style.display = 'none';
    });

    window.addEventListener('error', function (event) {
      var box = document.getElementById('masters-error');
      var status = document.getElementById('masters-status');
      if (!box) return;
      if (status) status.textContent = 'Не удалось запустить приложение';
      box.style.display = 'block';
      var details = '';
      if (event.error) {
        details = event.error.message ? String(event.error.message) + '\n' : '';
        details += event.error.stack || String(event.error);
      }
      if (!details) details = event.message || 'Неизвестная ошибка';
      if (event.filename) {
        details += '\n' + event.filename + ':' + (event.lineno || '') + ':' + (event.colno || '');
      }
      box.textContent = details;
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
